[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tfvideo"
dynamic = ["version"]
description = "MiniMax H3 audio-video DiT on TensorFold's CUDA kernels (NVFP4 W4A4 / FP8), with a ComfyUI node"
requires-python = ">=3.11"
dependencies = ["numpy", "safetensors"]

[tool.setuptools.packages.find]
include = ["tfvideo*"]

[tool.setuptools.dynamic]
version = { attr = "tfvideo.__version__" }
